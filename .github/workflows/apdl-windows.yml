name: APDL and NASTRAN Windows x64

on:
  push:
    branches: ['codex/apdl-*']
    tags: ['apdl-nastran-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Check release version validation
        shell: pwsh
        run: ./test/TestApdlReleaseVersion.ps1
      - name: Build Windows x64 Release and package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^apdl-nastran-v(7\.[0-9]+\.[0-9]+\.[0-9]+)$') { throw 'Invalid APDL/NASTRAN release tag.' }
            ./Build/scripts/Build-APDL.ps1 -ReleaseVersion $Matches[1]
          } else {
            ./Build/scripts/Build-APDL.ps1 -BuildNumber ${{ github.run_number }}
          }
      - name: Validate documentation
        shell: pwsh
        run: ./Build/scripts/Test-Docs.ps1
      - name: Check NASTRAN column guides and Chinese language pack
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = Get-ChildItem Bin -Filter Notepad3.exe -Recurse | Where-Object { $_.Directory.Name -like 'Release_x64_*' } | Select-Object -First 1
          $fontRoot = Join-Path $env:RUNNER_TEMP 'sarasa-guide-fonts'
          New-Item $fontRoot -ItemType Directory -Force | Out-Null
          $archive = Join-Path $fontRoot 'SarasaTermSC.7z'
          Invoke-WebRequest 'https://github.com/be5invis/Sarasa-Gothic/releases/download/v1.0.43/SarasaTermSC-TTF-1.0.43.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'C915EF316F0194A3F25185E0370B226E073ABE68B877C6BD678CE3071E215567') { throw 'Test font checksum mismatch.' }
          7z e $archive SarasaTermSC-Regular.ttf SarasaTermSC-Bold.ttf "-o$fontRoot" -y | Out-Null
          if ($LASTEXITCODE) { throw 'Test font extraction failed.' }
          $fonts = @((Join-Path $fontRoot 'SarasaTermSC-Regular.ttf'), (Join-Path $fontRoot 'SarasaTermSC-Bold.ttf'))
          ./test/TestNastranColumnGuides.ps1 -ExePath $exe.FullName -FontFiles $fonts
      - name: Upload executable and portable package
        uses: actions/upload-artifact@v4
        with:
          name: Notepad3-APDL-NASTRAN-x64
          if-no-files-found: error
          path: |
            Bin/APDL-artifacts/*.zip
            Bin/APDL-artifacts/Notepad3.exe
            Bin/APDL-artifacts/build-info.json
            Bin/APDL-artifacts/SHA256SUMS.txt
            Bin/APDL-artifacts/README-APDL-NASTRAN.txt

  release:
    if: startsWith(github.ref, 'refs/tags/apdl-nastran-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Notepad3-APDL-NASTRAN-x64
          path: release-assets
      - name: Verify release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $info = Get-Content release-assets/build-info.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -cne "apdl-nastran-v$($info.version)" -or
              $info.commit -cne $env:SOURCE_COMMIT -or $info.architecture -ne 'x64') { throw 'Release provenance mismatch.' }
          $zipName = "Notepad3-APDL-NASTRAN-$($info.version)-x64.zip"
          $hashes = @(Get-Content release-assets/SHA256SUMS.txt)
          if ($hashes.Count -ne 2) { throw 'Expected portable ZIP and EXE checksums.' }
          $expectedNames = @($zipName, 'Notepad3.exe')
          foreach ($line in $hashes) {
            if ($line -cnotmatch '^([a-f0-9]{64})  (.+)$') { throw 'Invalid checksum record.' }
            $hash, $name = $Matches[1], $Matches[2]
            if ($name -cnotin $expectedNames) { throw 'Unexpected checksum filename.' }
            $expectedNames = @($expectedNames | Where-Object { $_ -cne $name })
            if ((Get-FileHash (Join-Path release-assets $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw "Checksum mismatch: $name" }
          }
          if ($expectedNames.Count) { throw 'Missing release checksum.' }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --draft \
            --title "Notepad3 APDL / NASTRAN ${RELEASE_TAG#apdl-nastran-v} (Windows x64)" \
            --notes-file Build/Docs/RELEASE-APDL-NASTRAN.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
